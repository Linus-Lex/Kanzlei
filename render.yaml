services:
  - type: web
    name: kanzlei-ki
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kanzlei-ki-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_REDIRECT_URI
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"

databases:
  - name: kanzlei-ki-db
    plan: starter
    databaseName: kanzlei_ki
